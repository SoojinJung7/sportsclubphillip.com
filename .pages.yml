# Pages CMS configuration — https://pagescms.org
# The designer signs in at app.pagescms.org with GitHub, opens this repo,
# and edits everything below with a friendly UI (no code).

media:
  - name: images
    label: 사진 파일
    input: public/uploads
    output: /uploads
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
  - name: videos
    label: 영상 파일
    input: public/videos
    output: /videos
    extensions: [mp4, webm, mov]
    categories: [video]

content:
  - name: monthly_posters
    label: "📅 이달의 포스터 (매달 교체)"
    type: file
    path: content/posters.json
    fields:
      - { name: scheduleOperating, label: "영업 안내 포스터 — 홈 '영업 안내' + 시간표 페이지", type: image, options: { media: images } }
      - { name: scheduleGx, label: "GX 강습 스케줄 포스터 — 시간표 페이지", type: image, options: { media: images } }
      - { name: swimmingSchedule, label: "수영 강습 스케줄 포스터 — 수영강습 페이지", type: image, options: { media: images } }
      - { name: swimmingNotice, label: "수영 강습 안내 포스터 — 수영강습 페이지 (자주 안 바뀜)", type: image, options: { media: images } }
      - { name: promoCurrent, label: "프로모션 포스터 1 — 홈 팝업·이달의 프로모션 + 프로모션 페이지", type: image, options: { media: images } }
      - { name: promoPilates, label: "프로모션 포스터 2 — 홈 팝업·이달의 프로모션", type: image, options: { media: images } }
      - { name: promoHealth1, label: "프로모션 포스터 3 — 홈 팝업·이달의 프로모션", type: image, options: { media: images } }
      - { name: promoHealth2, label: "프로모션 포스터 4 — 홈 팝업·이달의 프로모션 (지금은 미사용)", type: image, options: { media: images } }

  - name: settings
    label: 사이트 설정 (연락처·시간·SNS)
    type: file
    path: content/settings.json
    fields:
      - name: site
        label: 기본 정보
        type: object
        fields:
          - { name: name, label: 상호 (한글), type: string }
          - { name: nameEn, label: 상호 (영문), type: string }
          - { name: tagline, label: 태그라인, type: string }
          - { name: ceo, label: 대표이사, type: string }
          - { name: address, label: 주소, type: string }
          - { name: bizNo, label: 사업자등록번호, type: string }
          - { name: phone, label: 전화, type: string }
          - { name: fax, label: 팩스, type: string }
          - { name: email, label: 이메일, type: string }
      - name: hours
        label: 상담시간
        type: object
        list: true
        fields:
          - { name: d, label: 구분, type: string }
          - { name: t, label: 시간, type: string }
      - name: external
        label: 외부 링크
        type: object
        fields:
          - { name: naverBooking, label: 네이버 예약, type: string }
          - { name: kakao, label: 카카오, type: string }
          - { name: instagram, label: 인스타그램, type: string }
          - { name: facebook, label: 페이스북, type: string }
          - { name: naverBlog, label: 네이버 블로그, type: string }
          - { name: naverMap, label: 네이버 지도, type: string }

  - name: media
    label: 사진 (시설·브랜드·월간 포스터)
    type: file
    path: content/media.json
    list: true
    view:
      fields: [key, alt, src]
    fields:
      - { name: key, label: 코드 (수정하지 마세요), type: string, readonly: true }
      - { name: alt, label: 설명 (대체 텍스트), type: string }
      - name: src
        label: 사진 교체 (파일 업로드 · 비워두면 기본 사진 사용)
        type: image
        options: { media: images }

  - name: translations
    label: 번역 (한국어 → English)
    type: file
    path: content/translations.json
    list: true
    view:
      fields: [ko, en]
    fields:
      - { name: ko, label: 한국어 (원문 · 수정하면 매칭 깨짐), type: string, readonly: true }
      - { name: en, label: English, type: text }

  - name: popup
    label: 홈 팝업 · 프로모션 포스터
    type: file
    path: content/popup.json
    fields:
      - { name: enabled, label: 팝업 표시하기, type: boolean }
      - { name: title, label: 제목, type: string }
      - { name: link, label: 기본 링크 주소, type: string }
      - { name: intervalMs, label: 자동 넘김 간격 (밀리초 · 3000 = 3초), type: number }
      - name: slides
        label: 포스터 목록 (위→아래 순서로 넘어감 · 첫 번째가 항상 먼저 표시)
        type: object
        list: true
        view:
          fields: [image, alt]
        fields:
          - { name: image, label: 이미지 코드 (아래 '사진'의 key · 예 promoCurrent), type: string }
          - { name: alt, label: 설명 (대체 텍스트), type: string }
          - { name: link, label: 링크 주소 (비우면 기본 링크), type: string }

  - name: operating_calendar
    label: 운영 캘린더 (휴관일 · 공휴일 · 시설 시간)
    type: file
    path: content/operating-calendar.json
    fields:
      - name: defaultClosedRule
        label: 기본 휴관 규칙 (아래 '월별 설정'에 해당 달이 없을 때만 사용)
        type: object
        fields:
          - { name: enabled, label: 사용, type: boolean }
          - { name: weekday, label: 요일 (0=일 … 6=토), type: number }
          - { name: nths, label: 몇째 주 (1,3,5), type: number, list: true }
          - { name: label, label: 안내 문구, type: string }
      - name: months
        label: 월별 설정 (매달 운영안내 포스터 보고 추가)
        type: object
        list: true
        view:
          fields: [month]
        fields:
          - { name: month, label: 대상 월 (예 2026-08), type: string }
          - { name: closed, label: 휴관일 (예 2026-08-02), type: string, list: true }
          - { name: specialOpen, label: 특별 영업일 (휴관일이지만 여는 날), type: string, list: true }
          - name: holidays
            label: 공휴일 (GX·수영 강습 미운영 · 일요일 시간표 적용)
            type: object
            list: true
            fields:
              - { name: date, label: 날짜 (예 2026-08-15), type: string }
              - { name: label, label: 이름 (예 광복절), type: string }
          - { name: note, label: 메모, type: string }
      - name: facilities
        label: 시설별 운영시간
        type: object
        list: true
        view:
          fields: [label]
        fields:
          - { name: label, label: 시설명, type: string }
          - { name: color, label: 표시 색상, type: string }
          - { name: openOnClosedDay, label: 휴관일에도 운영, type: boolean }
          - name: hours
            label: 요일별 시간
            type: object
            list: true
            fields:
              - { name: when, label: 구분 (weekday=평일 / sat=토 / sun=일·공휴일), type: string }
              - { name: open, label: 오픈 (예 06:00), type: string }
              - { name: close, label: 마감 (예 23:00), type: string }

  - name: videos
    label: 영상 (홈 PHILLIP LIFE · 최대 5개)
    type: file
    path: content/videos.json
    fields:
      - { name: heading, label: 섹션 제목, type: string }
      - { name: subtitle, label: 섹션 부제, type: string }
      - name: items
        label: 영상 목록 (최대 5개 · 위→아래 순서로 노출)
        type: object
        list: { max: 5 }
        view:
          fields: [titleKo, video, youtube]
        fields:
          - { name: video, label: 영상 파일 (mp4 선택 또는 경로, 예: /videos/파일.mp4), type: file, options: { media: videos } }
          - { name: youtube, label: 또는 YouTube 영상 ID (파일 대신 사용, 예: eCuJvyyHrsQ), type: string }
          - { name: poster, label: 썸네일 이미지 (선택 · 업로드 또는 경로), type: string }
          - { name: titleKo, label: 제목 (한국어), type: string }
          - { name: titleEn, label: 제목 (English), type: string }
          - { name: bodyKo, label: 설명 (한국어), type: text }
          - { name: bodyEn, label: 설명 (English), type: text }

